; Frame Keyboard Summoner settings
; Read once when the game starts: restart Skyrim VR after editing.
; With Mod Organizer 2, edit this file inside the mod folder
; (right-click the mod > Open in Explorer > SKSE\Plugins).

[General]
; 1 = write per-keypress details to the log (for bug reports). The log is at
; Documents\My Games\Skyrim VR\SKSE\FrameKeyboardSummoner.log
DebugLog=0

[Keyboard]
; 1 = apply the fix. 0 = the plugin does nothing at all (the game's original keyboard call).
Enabled=1

[TextOverlay]
; The Steam Frame keyboard has no text field, so a small box above it shows what you typed.
; 1 = show the box, 0 = hide it (typing still works, you just don't see the text)
Enabled=1
; 0 = box stays where you were looking when the keyboard opened (like the keyboard itself)
; 1 = box follows your head
FollowHead=0
; Box width in meters
WidthMeters=0.6
; Distance in front of your eyes in meters
DistanceMeters=1.0
; Meters right (+) or left (-) of your gaze
OffsetX=0.0
; Meters above (+) or below (-) your gaze
OffsetY=-0.03

[Hotkeys]
; Emergency hotkeys on the PC keyboard, off by default.
; Use them only when a text prompt is waiting and no keyboard is visible.
; Summoning at any other time can make the game take the result as an answer and skip steps.
; With Enabled=0 nothing reads the keyboard at all.
Enabled=0
; Ctrl+Alt+<key> opens the keyboard (single letter or digit)
SummonKey=K
; Ctrl+Alt+<key> closes the keyboard
HideKey=H
